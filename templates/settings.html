{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><div class="eyebrow">System</div><h1>School settings</h1>
<p class="lede">These details appear at the top of report cards and other documents.</p></div></div>
<form method="post" enctype="multipart/form-data">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="card">
  <h3>School details</h3>
  <div class="grid cols-2">
    <div class="field"><label>School name</label><input type="text" name="school_name" value="{{ s.school_name }}"></div>
    <div class="field"><label>Motto (optional)</label><input type="text" name="school_motto" value="{{ s.school_motto }}"></div>
  </div>
  <div class="field"><label>Address</label><input type="text" name="school_address" value="{{ s.school_address }}"></div>
  <div class="grid cols-2">
    <div class="field"><label>Phone</label><input type="text" name="school_phone" value="{{ s.school_phone }}"></div>
    <div class="field"><label>Email</label><input type="text" name="school_email" value="{{ s.school_email }}"></div>
  </div>
  <div class="field"><label>Principal / Head teacher name</label><input type="text" name="principal_name" value="{{ s.principal_name }}"></div>
  <div class="field"><label>Logo</label>
    {% if has_logo %}<p class="small">A logo is set.</p>{% endif %}
    <input type="file" name="logo" accept=".png,.jpg,.jpeg">
  </div>
</div>
<div class="card section">
  <h3>Marking &amp; report cards</h3>
  <div class="grid cols-2">
    <div class="field"><label>Pass mark (%)</label><input type="number" step="0.1" name="pass_mark" value="{{ s.pass_mark }}"></div>
    <div class="field"><label class="checkline" style="margin-top:26px;"><input type="checkbox" name="show_subject_position" {{ 'checked' if s.show_subject_position=='1' }}> Show each student's position in subject on report cards</label></div>
  </div>
  <div class="field"><label class="checkline"><input type="checkbox" name="require_verified" {{ 'checked' if s.require_verified=='1' }}> Only include verified marks in results and report cards</label></div>
  <div class="field"><label>Report card footer note</label><input type="text" name="report_footer" value="{{ s.report_footer }}"></div>
</div>
<div class="card section">
  <h3>Backup</h3>
  <div class="field"><label>Also copy backups to this folder (optional)</label>
  <input type="text" name="backup_copy_dir" value="{{ s.backup_copy_dir }}" placeholder="e.g. D:\School Backups or a USB drive path"></div>
</div>
<div class="form-actions"><button class="btn btn-primary">Save settings</button></div>
</form>
{% if has_logo %}
<form method="post" action="{{ url_for('system.logo_remove') }}" style="margin-top:10px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-danger">Remove logo</button>
</form>
{% endif %}
{% endblock %}
