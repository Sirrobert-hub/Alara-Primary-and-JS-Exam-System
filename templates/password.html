{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>Change password</h1>
{% if forced %}<p class="lede">For security, please choose a new password before continuing.</p>{% endif %}
</div></div>
<div class="card" style="max-width:420px;">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label>Current password</label><input type="password" name="current" required></div>
    <div class="field"><label>New password</label><input type="password" name="new" required minlength="6"></div>
    <div class="field"><label>Confirm new password</label><input type="password" name="confirm" required minlength="6"></div>
    <div class="form-actions">
      <button class="btn btn-primary">Save password</button>
      {% if not forced %}<a href="{{ url_for('system.dashboard') }}" class="btn">Cancel</a>{% endif %}
    </div>
  </form>
</div>
{% endblock %}
